spring.application.name=orbit-server
server.port=8080

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/orbit?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=orbit
spring.datasource.password=${ORBIT_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

orbit.avatar-dir=./data/avatars

logging.level.com.example.orbit.server=INFO
logging.level.org.hibernate.SQL=WARN
